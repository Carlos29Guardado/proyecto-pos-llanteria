<div style="padding: 5px 20px 20px 20px; max-width: 1100px; margin: 0 auto; font-family: 'Segoe UI', Arial, sans-serif;">
  <h2 style="text-align: center; margin-top: 10px; margin-bottom: 20px; color: #333;">Control de Usuarios y Empleados</h2>

  <!-- 1. Tarjeta del Formulario -->
  <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 25px;">
    
    <h4 style="color: #0056b3; margin-top: 0; margin-bottom: 15px;">
      <!-- Cambia el título dependiendo de si estamos creando o editando -->
      {{ usuarioActual._id ? 'Editar' : 'Registrar Nuevo' }} Usuario
    </h4>
    
    <form (ngSubmit)="guardarUsuario()" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
      
      
      <input type="text" name="nombre" [(ngModel)]="usuarioActual.nombre" placeholder="Nombre completo" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      
      <input type="email" name="correo" [(ngModel)]="usuarioActual.correo" placeholder="Correo electrónico" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      
      <input type="password" name="password" [(ngModel)]="usuarioActual.password" placeholder="Contraseña" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      
      <select name="rol" [(ngModel)]="usuarioActual.rol" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: white;">
        <option value="CAJERO">CAJERO</option>
        <option value="ADMIN">ADMINISTRADOR</option>
      </select>
      
      <button type="submit" style="background-color: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        {{ usuarioActual._id ? 'Actualizar' : 'Guardar' }}
      </button>
      
      <!-- Botón de cancelar que solo aparece si estamos editando -->
      <button type="button" *ngIf="usuarioActual._id" (click)="limpiarFormulario()" style="background-color: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">
        Cancelar
      </button>

    </form>
  </div>

  <!-- 2. Tabla de Usuarios -->
  <table style="width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
    <thead>
      <tr style="background-color: #212529; color: white; text-align: left;">
        <th style="padding: 15px;">Nombre</th>
        <th style="padding: 15px;">Correo</th>
        <th style="padding: 15px; text-align: center;">Rol</th>
        <th style="padding: 15px; text-align: center;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of listaUsuarios" style="border-bottom: 1px solid #eee;">
        <td style="padding: 15px;">{{ u.nombre }}</td>
        <td style="padding: 15px;">{{ u.correo }}</td>
        
        <td style="padding: 15px; text-align: center;">
          <!-- Distintivo visual para los roles -->
          <span [ngStyle]="{'background-color': u.rol === 'ADMIN' ? '#dc3545' : '#198754', 'color': 'white', 'padding': '5px 10px', 'border-radius': '15px', 'font-size': '12px', 'font-weight': 'bold'}">
            {{ u.rol }}
          </span>
        </td>
        
        <td style="padding: 15px; display: flex; gap: 8px; justify-content: center;">
          <button (click)="cargarDatosEdicion(u)" title="Editar" style="background-color: #ffc107; color: #212529; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Editar
          </button>
          
          <button (click)="eliminarUsuario(u._id)" title="Eliminar" style="background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
