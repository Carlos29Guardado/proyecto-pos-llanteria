@if (router.url === '/login'){

<router-outlet></router-outlet>
}
@else{


<!-- 1. El Menú Lateral (Se queda igual) -->
<header class="barra-movil">
  <button type="button" class="btn-menu" aria-label="Abrir menú" (click)="alternarMenu()"><i class='bx bx-menu'></i></button>
  <span>Llantería POS</span>
</header>

@if (menuAbierto) {
  <div class="menu-fondo" (click)="alternarMenu()"></div>
}

<div class="menu-lateral" [class.abierto]="menuAbierto">
  <div class="menu-header">
    <h3>Menú Principal</h3>
    <!--<button class="btn-cerrar" (click)="alternarMenu()">×</button> -->
  </div>

  <nav class="menu-links" (click)="menuAbierto = false">
  <a routerLink="/inventario"><i class='bx bx-package'></i> Inventario</a>
  @if (esAdmin) {
  <a routerLink="/usuarios"><i class='bx bx-group'></i> Usuarios</a>
  }
  <a routerLink="/clientes"><i class='bx bx-id-card'></i> Clientes</a>
  <a routerLink="/ventas"><i class='bx bx-line-chart'></i> Ventas</a>
</nav>
   <a (click)="cerrarSesion()" class="btn-logout"><i class='bx bx-log-out'></i> Cerrar Sesión</a>
</div>

<!-- 2. EL CONTENEDOR QUE SERÁ EMPUJADO -->
<div class="contenido-principal" [class.desplazado]="menuAbierto">

  <!-- Aquí va tu componente de inventario -->
  <div class="area-trabajo">
    <router-outlet></router-outlet>

  </div>
</div>
}
