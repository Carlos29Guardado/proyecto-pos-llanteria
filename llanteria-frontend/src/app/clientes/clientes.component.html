<div
  style="padding: 5px 20px 20px 20px; max-width: 1100px; margin: 0 auto; font-family: 'Segoe UI', Arial, sans-serif;">
  <h2 style="text-align: center; margin-top: 10px; margin-bottom: 20px; color: #333;">Control de Clientes
  </h2>

  <!-- 1. Tarjeta del Formulario -->
  <div
    style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 25px;">

    <h4 style="color: #0056b3; margin-top: 0; margin-bottom: 15px;">
      <!-- Cambia el título dependiendo de si estamos creando o editando -->
      {{ clienteActual._id ? 'Editar' : 'Registrar Nuevo' }} Cliente
    </h4>

    <form (ngSubmit)="guardarCliente()" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">


      <input type="text" name="nombre" [(ngModel)]="clienteActual.nombre" placeholder="Nombre" required
        style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

      <input type="text" name="apellido" [(ngModel)]="clienteActual.apellido" placeholder="Apellido" required
        style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

      <input type="text" name="telefono" [(ngModel)]="clienteActual.telefono" placeholder="telefono" required
        style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      
      <input type="text" name="dui" [(ngModel)]="clienteActual.dui" placeholder="DUI" required
        style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

      

      <button type="submit"
        style="background-color: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        {{ clienteActual._id ? 'Actualizar' : 'Guardar' }}
      </button>

      <!-- Botón de cancelar que solo aparece si estamos editando -->
      <button type="button" *ngIf="clienteActual._id" (click)="limpiarFormulario()"
        style="background-color: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">
        Cancelar
      </button>

    </form>
  </div>

  <!-- 2. Tabla de Usuarios -->
  <table
    style="width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
    <thead>
      <tr style="background-color: #212529; color: white; text-align: left;">
        <th style="padding: 15px;">Nombre</th>
        <th style="padding: 15px;">Apellido</th>
        <th style="padding: 15px; text-align: center;">Telefono</th>
        <th style="padding: 15px; text-align: center;">DUI</th>
        <th style="padding: 15px; text-align: center;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of listaClientes" style="border-bottom: 1px solid #eee;">
        <td style="padding: 15px;">{{ c.nombre }}</td>
        <td style="padding: 15px;">{{ c.apellido }}</td>
        <td style="padding: 15px;">{{ c.telefono }}</td>
        <td style="padding: 15px;">{{ c.dui }}</td>

        <td style="padding: 15px; display: flex; gap: 8px; justify-content: center;">
          <button (click)="cargarDatosEdicion(c)" title="Editar"
            style="background-color: #ffc107; color: #212529; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Editar
          </button>

          <button (click)="eliminarCliente(c._id)" title="Eliminar"
            style="background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>>
