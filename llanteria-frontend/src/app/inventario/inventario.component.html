<div
  style="padding: 5px 20px 20px 20px; max-width: 1100px; margin: 0 auto; font-family: 'Segoe UI', Arial, sans-serif;">
  <h2 style="text-align: center; margin-top: 10px; margin-bottom: 20px; color: #333;">Control de Productos
  </h2>

  <!-- 1. Tarjeta del Formulario -->
  <div
    style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 25px;">

    <h4 style="color: #0056b3; margin-top: 0; margin-bottom: 15px;">
      <!-- Cambia el título dependiendo de si estamos creando o editando -->
      {{ productoActual._id ? 'Editar' : 'Registrar Nuevo' }} Producto
    </h4>

    <form (ngSubmit)="guardarProducto()" style="display: flex; flex-direction: column; gap: 15px;">
  
  <!-- Fila 1: Campos cortos -->
  <div style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%;">
    <input type="text" name="codigo" [(ngModel)]="productoActual.codigo" placeholder="Código" required
      style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

    <input type="text" name="marca" [(ngModel)]="productoActual.marca" placeholder="Marca" required
      style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

    <input type="number" name="stock" [(ngModel)]="productoActual.stock" placeholder="Stock" required
      style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

    <input type="number" name="precio" [(ngModel)]="productoActual.precio" placeholder="Precio" required
      style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
  </div>

  <!-- Fila 2: Descripción larga y botones a la derecha -->
  <div style="display: flex; gap: 10px; flex-wrap: wrap; width: 100%; align-items: center;">
    
    <!-- flex: 1 permite que la descripción tome todo el espacio sobrante -->
    <input type="text" name="descripcion" [(ngModel)]="productoActual.descripcion" placeholder="Descripción / Medida" required
      style="flex: 1; min-width: 300px; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

    <!-- margin-left: auto empuja este bloque de botones hacia la derecha -->
    <div style="display: flex; gap: 10px; margin-left: auto;">
      
      <!-- Botón Cancelar -->
      <button type="button" *ngIf="productoActual._id" (click)="limpiarFormulario()"
        style="background-color: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">
        Cancelar
      </button>
      
      <!-- Botón Guardar / Actualizar -->
      <button type="submit"
        style="background-color: #0d6efd; color: white; border: none; padding: 10px 30px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        {{ productoActual._id ? 'Actualizar' : 'Guardar' }}
      </button>

    </div>
  </div>

</form>
  </div>

  <!-- 2. Tabla de Productos -->
  <table
    style="width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
    <thead>
      <tr style="background-color: #212529; color: white; text-align: left;">
        <th style="padding: 15px;">Codigo</th>
        <th style="padding: 15px;">Descripción</th>
        <th style="padding: 15px;">Marca</th>
        <th style="padding: 15px;">Stock</th>
        <th style="padding: 15px; text-align: center;">Precio</th>
        <th style="padding: 15px; text-align: center;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of listaInventario" style="border-bottom: 1px solid #eee;">
        <td style="padding: 15px;">{{ p.codigo }}</td>
        <td style="padding: 15px;">{{ p.descripcion }}</td>
        <td style="padding: 15px;">{{ p.marca }}</td>
        <td style="padding: 15px;">{{ p.stock }}</td>
        <td style="padding: 15px;">{{ p.precio }}</td>

        <td style="padding: 15px; display: flex; gap: 8px; justify-content: center;">
          <button (click)="cargarDatosEdicion(p)" title="Editar"
            style="background-color: #ffc107; color: #212529; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Editar
          </button>

          <button (click)="eliminarProducto(p._id)" title="Eliminar"
            style="background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>>
