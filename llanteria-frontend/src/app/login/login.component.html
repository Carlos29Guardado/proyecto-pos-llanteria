<div class="login-container">
  <h2>Acceso al Sistema</h2>

  <!-- Conectamos el formulario de HTML con el FormGroup de TypeScript -->
  <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">

    <div>
      <label>Correo Electrónico:</label>
      <input type="email" formControlName="correo" placeholder="ejemplo@correo.com" value="cmgd">
    </div>

    <div>
      <label>Contraseña:</label>
      <div class="input-password-container">
        <input [type]="verPassword ? 'text' : 'password'" formControlName="password" placeholder="Contraseña">
        <i class='bx' [class.bx-show]="verPassword" [class.bx-hide]="!verPassword"
          (click)="verPassword = !verPassword"></i>
      </div>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">
      Entrar
    </button>
    <div style="display: flex; justify-content: center; margin-top: 20px;">
      <asl-google-signin-button type="standard" size="large"></asl-google-signin-button>
    </div>

  </form>
</div>
